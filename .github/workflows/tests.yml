# Dashboard smoke tests. Installs only the dashboard dependencies and pytest,
# not the notebook pipeline (spaCy, BERTopic, torch).
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0

      - name: Run tests
        run: pytest tests/
